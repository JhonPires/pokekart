<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>PokeKart — Corrida</title>

    <style>
        :root {
            --cyan: #28c9ff;
            --yellow: #ffd43b;
            --panel-bg: rgba(7, 20, 37, 0.65);
            --panel-border: 1px solid rgba(67, 173, 232, 0.35);
            --text: #f4f8ff;
            --muted: #8da5bd;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Inter, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            user-select: none;
        }


        /* CONTADOR DE LARGADA */
        #countdownOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 120px;
            font-weight: 900;
            color: #FFD54F;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 213, 79, 0.6);
            pointer-events: none;
            z-index: 200;
            font-family: sans-serif;
        }

        /* MENU ESC */
        #pauseMenu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
            color: #fff;
        }

        .lobbyBtn {
            background: #22c55e;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        #minimapCanvas {
            background: transparent !important;
            background-color: rgba(0, 0, 0, 0) !important;
        }

        .lobbyBtn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

    <!-- EFEITO LAMA NA TELA (EXPANDIDO) -->
    <div id="mudOverlay"
        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 5000;">
        <!-- Grande mancha superior esquerda -->
        <div
            style="position: absolute; top: -5%; left: 5%; width: 55vw; height: 45vh; background: #2b170b; border-radius: 40% 60% 50% 50%; filter: blur(8px); transform: rotate(-15deg); box-shadow: inset 20px 20px 40px rgba(0,0,0,0.8);">
        </div>

        <!-- Grande mancha superior direita cobrindo o ranking -->
        <div
            style="position: absolute; top: 0%; right: 0%; width: 50vw; height: 50vh; background: #3d2314; border-radius: 60% 40% 40% 60%; filter: blur(10px); transform: rotate(20deg); box-shadow: inset -20px 20px 40px rgba(0,0,0,0.8);">
        </div>

        <!-- Mancha central gigante tapando o meio da pista -->
        <div
            style="position: absolute; top: 25%; left: 20%; width: 60vw; height: 45vh; background: #1f0f07; border-radius: 50% 50% 60% 40%; filter: blur(12px); transform: rotate(10deg); box-shadow: inset 0 0 50px rgba(0,0,0,0.9);">
        </div>

        <!-- Mancha inferior esquerda perto do minimapa -->
        <div
            style="position: absolute; bottom: 0%; left: 0%; width: 40vw; height: 40vh; background: #331c0e; border-radius: 70% 30% 50% 50%; filter: blur(8px);">
        </div>

        <!-- Mancha inferior direita perto da velocidade -->
        <div
            style="position: absolute; bottom: 5%; right: 5%; width: 45vw; height: 40vh; background: #261308; border-radius: 40% 60% 30% 70%; filter: blur(9px);">
        </div>

        <!-- Pingo espirrado solto no topo -->
        <div
            style="position: absolute; top: 15%; left: 45%; width: 20vw; height: 15vh; background: #3d2314; border-radius: 50%; filter: blur(5px);">
        </div>
    </div>
