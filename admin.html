<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéKart — Painel Admin</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #07101f;
            --panel: #0d1a2d;
            --panel2: #101f35;
            --line: #1d3857;
            --cyan: #21c7ff;
            --text: #f4f8ff;
            --muted: #8496ad;
            --danger: #ff4b55;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
            color: var(--text);
            background: #050b16 url("img/background.png") center/cover no-repeat fixed;
            padding: 30px 20px;
        }

        .shell {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: rgba(13, 26, 45, 0.85);
            border: 1px solid var(--line);
            padding: 20px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
        }

        h1 {
            color: var(--cyan);
            font-size: 24px;
        }

        #adminStatus {
            color: var(--muted);
            font-size: 14px;
            font-weight: bold;
        }

        .config-block {
            background: rgba(13, 26, 45, 0.85);
            border: 1px solid var(--line);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .config-block h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #fff;
        }

        textarea {
            width: 100%;
            height: 180px;
            background: #020617;
            color: #a7f3d0;
            border: 1px solid var(--line);
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            border-radius: 8px;
            outline: none;
            resize: vertical;
        }

        textarea:focus {
            border-color: var(--cyan);
        }

        .btn-save {
            background: linear-gradient(135deg, var(--success), #16a34a);
            color: #022c22;
            font-weight: 900;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 12px;
            transition: 0.2s;
        }

        .btn-save:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .btn-back {
            background: transparent;
            border: 1px solid var(--cyan);
            color: var(--cyan);
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            font-size: 13px;
        }

        .btn-back:hover {
            background: var(--cyan);
            color: #050b16;
        }
    </style>
</head>

<body>

    <div class="shell">
        <header>
            <div>
                <h1>🛠️ Painel de Moderação</h1>
                <p id="adminStatus">Verificando permissões de acesso...</p>
            </div>
            <a href="index.html" class="btn-back">Voltar ao Jogo</a>
        </header>

        <!-- O painel só aparece se o usuário for admin -->
        <div id="adminPanel" style="display: none;">

            <div class="config-block">
                <h3>🎟️ Passe de Batalha (Níveis, XP e Prêmios)</h3>
                <textarea id="jsonBattlePass"></textarea>
                <button class="btn-save" onclick="salvarConfig('battle_pass', 'jsonBattlePass')">Salvar Passe de
                    Batalha</button>
            </div>

            <div class="config-block">
                <h3>🎡 Roleta Diária (Itens, Valores e Pesos de Probabilidade)</h3>
                <textarea id="jsonRoulette"></textarea>
                <button class="btn-save" onclick="salvarConfig('roulette', 'jsonRoulette')">Salvar Roleta</button>
            </div>

            <div class="config-block">
                <h3>📜 Missões Diárias (Metas, XP e Recompensas em Moedas)</h3>
                <textarea id="jsonMissions"></textarea>
                <button class="btn-save" onclick="salvarConfig('daily_missions', 'jsonMissions')">Salvar Missões
                    Diárias</button>
            </div>
            <div class="config-block">
                <h3>🏆 Conquistas (Títulos, Descrições e Ícones)</h3>
                <textarea id="jsonAchievements"></textarea>
                <button class="btn-save" onclick="salvarConfig('achievements', 'jsonAchievements')">Salvar
                    Conquistas</button>
            </div>
        </div>
    </div>

    <!-- Scripts de Conexão e Lógica -->
    <script src="auth.js"></script>
    <script src="admin.js"></script>
</body>

</html>
