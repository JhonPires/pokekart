<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <title>PokeKart — Torre</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: Inter, system-ui, sans-serif;
            user-select: none;
        }

        /* TELA DE CARREGAMENTO */
        /* TELA DE CARREGAMENTO */
        #loadingScreen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #38bdf8;
            font-weight: 900;
            z-index: 9999;
            transition: opacity 0.5s;
            overflow: hidden;
            /* Garante que o vídeo não vaze da tela */
        }

        /* VÍDEO DE FUNDO TELA CHEIA */
        #loadingVideo {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: -2;
            /* Fica no fundo absoluto */
        }

        /* MÁSCARA ESCURA SOBRE O VÍDEO (Equivalente ao antigo linear-gradient) */
        .video-overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 11, 22, 0.7);
            z-index: -1;
        }

        /* CONTAINER DA HUD */
        #ui-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        /* BOTÃO DE SAÍDA (Esquerda) */
        .btn-back {
            pointer-events: auto;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #ef4444;
            color: #f87171;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            backdrop-filter: blur(8px);
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.2);
        }

        .btn-back:hover {
            background: #ef4444;
            color: #fff;
            transform: scale(1.05);
        }

        /* PAINEL DA TORRE (Direita) */
        .hud-panel {
            background: linear-gradient(135deg, rgba(12, 28, 48, 0.9), rgba(5, 15, 30, 0.95));
            border: 1px solid #1e3a57;
            border-radius: 16px;
            padding: 15px 20px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(56, 189, 248, 0.1);
            backdrop-filter: blur(12px);
            min-width: 220px;
            text-align: right;
        }

        .hud-title {
            color: #facc15;
            font-size: 18px;
            font-weight: 900;
            margin: 0 0 2px 0;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.4);
        }

        .hud-leader {
            color: #91a7be;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .hud-leader b {
            color: #fff;
        }

        /* BARRA DE PROGRESSO */
        .hud-floor-text {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 900;
            color: #38bdf8;
            margin-bottom: 4px;
        }

        .hud-progress-bg {
            width: 100%;
            height: 8px;
            background: #0f172a;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #1e3a57;
        }

        .hud-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #10b981);
            width: 0%;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* DICA DE CONTROLO (Em baixo, centro) */
        .controls-hint {
            align-self: center;
            background: rgba(9, 23, 42, 0.7);
            border: 1px solid #38bdf8;
            padding: 8px 18px;
            border-radius: 20px;
            color: #dcecff;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
            animation: pulseGlow 2s infinite;
        }



        /* NOVO CONTÊINER INFERIOR PARA O LOADING */
        #loading-wrapper {
            position: absolute;
            bottom: 8%;
            /* Fica na parte inferior */
            left: 50%;
            transform: translateX(-50%);
            /* Centraliza perfeitamente */
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            z-index: 10000;
        }

        /* TÍTULO CARREGANDO CORRIDA */
        .loading-title {
            color: #ffffff;
            font-size: 22px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.8);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* BARRA EXTERNA (Borda Azul Neon) */
        .loading-bar-container {
            position: relative;
            width: 550px;
            max-width: 85vw;
            height: 30px;
            background: rgba(4, 15, 35, 0.85);
            border: 2px solid #00e5ff;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5), inset 0 0 10px rgba(0, 229, 255, 0.3);
            display: flex;
            align-items: center;
            padding: 3px;
            /* Espaço para o preenchimento interno */
        }

        /* LINHAS LATERAIS NEON (Estilo Corrida) */
        .loading-bar-container::before,
        .loading-bar-container::after {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 2px;
            background: #00e5ff;
            box-shadow: 0 0 8px #00e5ff;
        }

        .loading-bar-container::before {
            left: -60px;
        }

        .loading-bar-container::after {
            right: -60px;
        }

        /* PREENCHIMENTO CIANO (Efeito de Vidro/Brilho) */
        /* PREENCHIMENTO CIANO (Sincronizado em 6.5 segundos) */
        .loading-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(180deg, #a6f5ff 0%, #00d4ff 40%, #0088cc 100%);
            border-radius: 15px;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.8);
            /* Duração exata de 6.5s, parando em 98% para aguardar o fechamento do mundo */
            animation: fakeLoad 8.0s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* LOGO NO CENTRO SUPERIOR DO LOADING */
        .loading-logo {
            position: absolute;
            top: 8%;
            /* Distância da parte superior da tela */
            left: 50%;
            transform: translateX(-50%);
            /* Centraliza perfeitamente */
            max-width: 480px;
            /* Tamanho máximo para não exagerar */
            width: 40vw;
            /* Responsivo em telas menores */
            opacity: 0.7;
            height: auto;
            z-index: 10001;
            filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.5));
            /* Efeito de brilho opcional */
        }

        /* POKÉBOLA EM CSS PURO NA DIREITA */
        .pokeball-icon {
            position: absolute;
            right: -15px;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            background-color: white;
            border: 3px solid #001f3f;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.8);
            z-index: 2;
        }

        .pokeball-icon::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: #ff0000;
            /* Parte vermelha */
            border-bottom: 3px solid #001f3f;
        }

        .pokeball-icon::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background: white;
            /* Botão central */
            border: 3px solid #001f3f;
            border-radius: 50%;
            box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5);
        }

        /* DICA EM CARROSSEL EMBAIXO DA BARRA */
        #loadingTip {
            margin-top: 15px;
            font-size: 15px;
            color: #d6f9ff;
            font-weight: 500;
            text-align: center;
            transition: opacity 0.5s ease-in-out;
            opacity: 1;
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.4);
        }

        .fade-oculto {
            opacity: 0 !important;
        }

        /* Adicione esta classe para o controle do JS */
        .fade-oculto {
            opacity: 0 !important;
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        @keyframes pulseGlow {

            0%,
            100% {
                box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
            }

            50% {
                box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            }
        }

        /* ANIMAÇÃO DE PREENCHIMENTO EM 6.5 SEGUNDOS */
        @keyframes fakeLoad {
            0% {
                width: 0%;
            }

            30% {
                width: 45%;
            }

            70% {
                width: 78%;
            }

            95% {
                width: 96%;
            }

            100% {
                width: 98%;
            }
        }
    </style>
</head>

<body>

    <div id="loadingScreen">
        <!-- VÍDEO DE FUNDO SUBSTITUINDO A IMAGEM -->
        <video autoplay muted loop id="loadingVideo">
            <source src="img/loading.mp4" type="video/mp4">
            O seu navegador não suporta a tag de vídeo.
        </video>
        <!-- MÁSCARA ESCURA PARA DESTAQUE DO TEXTO -->
        <div class="video-overlay"></div>

        <!-- LOGO CENTRALIZADA NO TOPO -->
        <img src="img/logo.png" alt="Logo PokeKart" class="loading-logo">

        <!-- O GRUPO DA BARRA E DICAS (Fica na base) -->
        <div id="loading-wrapper">
            <div class="loading-title">🏁 CARREGANDO... 🏁</div>

            <div class="loading-bar-container">
                <div class="loading-bar-fill"></div>
                <div class="pokeball-icon"></div>
            </div>

            <div id="loadingTip">Preparando a pista para a sua aventura...</div>
        </div>
    </div>

    <div id="ui-container">
        <div class="hud-top">
            <button class="btn-back" id="btnAbandonar" onclick="window.location.href='index.html'">↩ Voltar ao Lobby
            </button>

            <div class="hud-panel">
                <h1 class="hud-title" id="hudGymName">Ginásio</h1>
                <div class="hud-leader">Líder: <b id="hudLeaderName">???</b></div>

                <div class="hud-floor-text">
                    <span>PROGRESSO</span>
                    <span id="hudFloorCount">Andar 1/5</span>
                </div>
                <div class="hud-progress-bg">
                    <div class="hud-progress-fill" id="hudProgressBar"></div>
                </div>
            </div>
        </div>

        <div class="controls-hint">
            WASD / Setas para Dirigir 🏎️
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <!-- Injeta a música do jogo -->
    <script src="music.js"></script>
    <script src="hub.js"></script>
    <!-- Script das Dicas de Loading -->
    <!-- Script das Dicas de Loading em Carrossel -->
    <!-- Script das Dicas de Loading em Carrossel (Corrigido) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dicas = [
                "DICA: Ficou preso? Pressione a tecla 'R' rapidamente para escapar de armadilhas!",
                "DICA: O Vórtice da Sabrina te puxa para o centro. Tente manter a distância!",
                "DICA: Giovanni é o chefe da Máfia e é imune às Caixas Rocket. Cuidado!",
                "A corrida não é apenas sobre velocidade, mas sobre quem domina as curvas.",
                "Mantenha o foco. A vitória está logo após a próxima ultrapassagem.",
                "Um verdadeiro mestre das pistas não desiste na primeira derrapada.",
                "DICA: Líderes de Ginásio usam habilidades únicas que podem mudar o rumo da corrida."
            ];

            const tipElement = document.getElementById('loadingTip');

            if (tipElement) {
                let currentIndex = Math.floor(Math.random() * dicas.length);
                tipElement.innerText = dicas[currentIndex];

                setInterval(() => {
                    // 1. Adiciona a classe que joga a opacidade para 0 (inicia o fade-out)
                    tipElement.classList.add('fade-oculto');

                    // 2. Aguarda 0.5s para o texto sumir totalmente, troca a frase e remove a classe
                    setTimeout(() => {
                        currentIndex = (currentIndex + 1) % dicas.length;
                        tipElement.innerText = dicas[currentIndex];

                        // 3. Remove a classe, voltando a opacidade para 1 (inicia o fade-in)
                        tipElement.classList.remove('fade-oculto');
                    }, 500);

                }, 2500);
            }
        });
    </script>
    </script>
</body>

</html>
