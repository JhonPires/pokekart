<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>PokeKart</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #87CEEB;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      color: white;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
      font-size: 14px;
      line-height: 1.6;
      pointer-events: none;
    }

    #hud b {
      color: #FFD54F;
    }

    #speedbar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 18px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 9px;
      border: 2px solid rgba(255, 255, 255, 0.6);
      overflow: hidden;
    }

    #speedfill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4FC3F7, #FFD54F, #FF7043);
      transition: width 0.05s linear;
    }

    #turboLabel {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      color: #FFD54F;
      font-weight: bold;
      font-size: 20px;
      text-shadow: 0 2px 6px black;
      opacity: 0;
      transition: opacity 0.15s;
    }

    #raceHud {
      position: absolute;
      top: 16px;
      right: 16px;
      color: white;
      text-align: right;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    #raceHud .lapline {
      font-size: 18px;
      font-weight: bold;
    }

    #standingsList {
      margin-top: 6px;
      font-size: 13px;
      line-height: 1.6;
    }

    #finishOverlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 20;
    }

    #lobby {
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 20, 0.82);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 10;
    }

    .lobbyBtn {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #FFD54F;
      color: #222;
    }

    .lobbyBtn:hover {
      background: #FFCA28;
    }

    .lobbyBtnGhost {
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }

    #joinBox {
      display: none;
      gap: 8px;
    }

    #joinBox input {
      padding: 9px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
      width: 140px;
      text-align: center;
      text-transform: uppercase;
    }

    #roomCodeDisplay {
      display: none;
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 4px;
      background: rgba(255, 255, 255, 0.15);
      padding: 8px 20px;
      border-radius: 8px;
    }

    #lobbyStatus {
      min-height: 20px;
      font-size: 14px;
      opacity: 0.9;
    }

    #playerList {
      font-size: 14px;
      opacity: 0.95;
      line-height: 1.7;
      min-height: 0;
    }

    #connStatus {
      position: absolute;
      bottom: 16px;
      right: 16px;
      color: white;
      font-size: 13px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
      text-align: right;
    }

    @import url('https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Rajdhani:wght@700&display=swap');

    /* Container Principal da HUD */
    #hud-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      font-family: 'Rajdhani', sans-serif;
      user-select: none;
      padding: 20px;
      box-sizing: border-box;
    }

    /* Painel Superior Esquerdo: Jogador e Voltas */
    .hud-panel-top-left {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(15, 15, 25, 0.85);
      border-left: 6px solid #ff0055;
      padding: 12px 24px;
      clip-path: polygon(0 0, 100% 0, 85% 100%, 0 100%);
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
    }

    .player-name {
      color: #00ffff;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
    }

    .lap-counter {
      color: #ffffff;
      font-family: 'Teko', sans-serif;
      font-size: 18px;
      line-height: 1;
    }

    .lap-counter span {
      color: #ff0055;
    }

    /* Painel Superior Direito: Posição */
    .hud-panel-top-right {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(15, 15, 25, 0.85);
      border-right: 6px solid #00ffff;
      padding: 10px 30px;
      clip-path: polygon(15% 0, 100% 0, 100% 100%, 0 100%);
      text-align: right;
    }

    .position-title {
      color: #aaaaaa;
      font-size: 14px;
      text-transform: uppercase;
    }

    .position-display {
      font-family: 'Teko', sans-serif;
      font-size: 26px;
      color: #fff200;
      line-height: 0.9;
      text-shadow: 3px 3px 0px #ff0055;
    }

    /* Painel Inferior Direito: Velocímetro Anime */
    .hud-speedometer {
      position: absolute;
      bottom: 25px;
      right: 25px;
      background: rgba(15, 15, 25, 0.85);
      padding: 15px 25px;
      border-bottom: 4px solid #fff200;
      clip-path: polygon(10% 0, 100% 0, 100% 100%, 0 100%);
      text-align: right;
      min-width: 180px;
    }

    .speed-value {
      font-family: 'Teko', sans-serif;
      font-size: 70px;
      color: #ffffff;
      line-height: 0.8;
      font-style: italic;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .speed-unit {
      font-size: 16px;
      color: #00ffff;
      letter-spacing: 2px;
    }

    /* Barra de Progresso da Velocidade */
    .speed-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      margin-top: 5px;
      overflow: hidden;
      border-radius: 2px;
    }

    .speed-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00ffff, #ff0055);
      transition: width 0.1s ease-out;
    }
  </style>
</head>

<body>
  <div id="hud-container">
    <!-- Painel Esquerdo (Jogador e Volta) -->
    <div class="hud-panel-top-left">
      <div class="player-name" id="hud-player-name">PILOTO</div>
      <div class="lap-counter">VOLTA <span id="lapcount">1</span>/<span id="totallaps">3</span></div>
    </div>

    <!-- Painel Direito (Posição) -->
    <div class="hud-panel-top-right">
      <div class="position-title">POSIÇÃO</div>
      <div class="position-display" id="hud-position">1º</div>
    </div>

    <!-- Velocímetro -->
    <div class="hud-speedometer">
      <div class="speed-value" id="hud-speed">0</div>
      <div class="speed-unit">KM/H</div>
      <div class="speed-bar-container">
        <div class="speed-bar-fill" id="speedfill"></div>
      </div>
    </div>
  </div>

  <div id="turboLabel">MINI-TURBO!</div>

    <div id="speedfill"></div>
  </div> -->
  <!-- <div id="connStatus"></div> -->

  <div id="lobby">
    <h2 style="margin:0;">🏁 Pokémon Kart</h2>
    <div style="display:flex; gap:12px;">
      <button id="btnHost" class="lobbyBtn">Criar Sala</button>
      <button id="btnJoin" class="lobbyBtn">Entrar em Sala</button>
    </div>
    <div id="joinBox">
      <input id="joinCode" placeholder="Código" maxlength="5">
      <button id="btnConnect" class="lobbyBtn">Conectar</button>
    </div>
    <div id="roomCodeDisplay"></div>
    <div id="playerList"></div>
    <div id="lobbyStatus"></div>
    <button id="btnStartRace" class="lobbyBtn" style="display:none;">Iniciar Corrida 🏁</button>
    <button id="btnPlaySolo" class="lobbyBtn lobbyBtnGhost">Jogar sozinho</button>
  </div>
  <!-- Importa o arquivo JS com a variável do Base64 -->
  <script src="kartzoroark.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script>
    // ------------------------------------------------------------
    // SETUP BÁSICO
    // ------------------------------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 60, 260);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Luz
    const sun = new THREE.DirectionalLight(0xffffff, 1.1);
    sun.position.set(40, 60, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -110; sun.shadow.camera.right = 110;
    sun.shadow.camera.top = 110; sun.shadow.camera.bottom = -110;
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));

    // ------------------------------------------------------------
    // PISTA - LOOP OVAL (curva definida por spline)
    // ------------------------------------------------------------
    const trackPoints = [
      new THREE.Vector3(0, 0, -70),
      new THREE.Vector3(50, 0, -65),
      new THREE.Vector3(80, 0, -20),
      new THREE.Vector3(75, 0, 25),
      new THREE.Vector3(40, 0, 55),
      new THREE.Vector3(0, 0, 75),
      new THREE.Vector3(-45, 0, 60),
      new THREE.Vector3(-75, 0, 20),
      new THREE.Vector3(-80, 0, -25),
      new THREE.Vector3(-45, 0, -65),
    ];
    //const trackCurve = new THREE.CatmullRomCurve3(trackPoints, true, 'catmullrom', 0.5);

    // Dicionário com traçados de pistas
    const TRACK_PRESETS = {
      oval: [
        new THREE.Vector3(0, 0, -70),
        new THREE.Vector3(50, 0, -65),
        new THREE.Vector3(80, 0, -20),
        new THREE.Vector3(75, 0, 25),
        new THREE.Vector3(40, 0, 55),
        new THREE.Vector3(0, 0, 75),
        new THREE.Vector3(-45, 0, 60),
        new THREE.Vector3(-75, 0, 20),
        new THREE.Vector3(-80, 0, -25),
        new THREE.Vector3(-45, 0, -65)
      ],
      circuitoE: [
        new THREE.Vector3(0, 0, -100),
        new THREE.Vector3(60, 0, -100),
        new THREE.Vector3(60, 0, -30),
        new THREE.Vector3(40, 0, 0),
        new THREE.Vector3(80, 0, 40),
        new THREE.Vector3(40, 0, 100),
        new THREE.Vector3(-40, 0, 100),
        new THREE.Vector3(-70, 0, 30),
        new THREE.Vector3(-30, 0, -30),
        new THREE.Vector3(-60, 0, -100)
      ],
      crash1: [
        // Reta Principal / Linha de Chegada (Diagonal Inferior Direita)
        new THREE.Vector3(25, 0, 35),
        new THREE.Vector3(45, 0, 15),

        // Canto Superior Direito e Reta Superior
        new THREE.Vector3(50, 0, -35),
        new THREE.Vector3(45, 0, -50),
        new THREE.Vector3(10, 0, -50),
        new THREE.Vector3(-10, 0, -45),

        // Alça Superior Esquerda
        new THREE.Vector3(-45, 0, -50),
        new THREE.Vector3(-55, 0, -35),

        // Descida Externa Esquerda e Curva Inferior Esquerda
        new THREE.Vector3(-55, 0, 0),
        new THREE.Vector3(-50, 0, 15),
        new THREE.Vector3(-30, 0, 10),

        // Trecho Interno Central (Série de ganchos em formato "M")
        new THREE.Vector3(-20, 0, -25),
        new THREE.Vector3(-15, 0, -35),
        new THREE.Vector3(-10, 0, -10),
        new THREE.Vector3(-5, 0, -35),
        new THREE.Vector3(0, 0, -25),

        // Gancho Extenso Inferior
        new THREE.Vector3(-5, 0, 25),
        new THREE.Vector3(-20, 0, 50),
        new THREE.Vector3(-10, 0, 65),
        new THREE.Vector3(10, 0, 55)
      ]
    };

    // Para carregar uma pista selecionada:
    function getTrackCurve(presetName = 'oval') {
      const points = TRACK_PRESETS[presetName] || TRACK_PRESETS.oval;
      return new THREE.CatmullRomCurve3(points, true, 'centripetal', 0.5);
    }

    // Substitua no seu código:
    const trackCurve = getTrackCurve('circuitoE');
    const trackWidth = 10;

    // Amostras pré-computadas da curva (ponto + normal lateral) — usadas pra colisão
    // com a borda da pista e pra estimar a volta, sem recalcular a spline toda hora.
    const TRACK_SAMPLE_COUNT = 360;
    const trackSamples = [];
    for (let i = 0; i < TRACK_SAMPLE_COUNT; i++) {
      const t = i / TRACK_SAMPLE_COUNT;
      const point = trackCurve.getPointAt(t);
      const tangent = trackCurve.getTangentAt(t).normalize();
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
      trackSamples.push({ t, point, normal });
    }
    function nearestTrackSample(position) {
      let best = trackSamples[0], bestDist = Infinity, bestIndex = 0;
      for (let i = 0; i < trackSamples.length; i++) {
        const d = trackSamples[i].point.distanceToSquared(position);
        if (d < bestDist) { bestDist = d; best = trackSamples[i]; bestIndex = i; }
      }
      return { sample: best, index: bestIndex };
    }

    // Gera geometria da pista extrudando a curva
    function buildTrackMesh() {
      const segments = 500;
      const positions = [];
      const uvs = [];
      const indices = [];

      const points = trackCurve.getSpacedPoints(segments);
      const sideVectors = [];

      for (let i = 0; i <= segments; i++) {
        const pPrev = points[(i - 1 + segments) % segments];
        const pNext = points[(i + 1) % segments];

        const dir = new THREE.Vector3().subVectors(pNext, pPrev);
        dir.y = 0;
        dir.normalize();

        let side = new THREE.Vector3(-dir.z, 0, dir.x).normalize();

        if (i > 0) {
          const prevSide = sideVectors[i - 1];
          if (side.dot(prevSide) < 0) {
            side.negate();
          }
        }
        sideVectors.push(side);

        const current = points[i % segments];

        const left = current.clone().addScaledVector(side, trackWidth / 2);
        const right = current.clone().addScaledVector(side, -trackWidth / 2);

        // Subimos Y para 0.03 para evitar sobreposição (Z-fighting) com o gramado
        positions.push(left.x, 0.03, left.z);
        positions.push(right.x, 0.03, right.z);

        // UVs sem multiplicadores manuais (deixa o trackTexture.repeat controlar)
        const progress = i / segments;
        uvs.push(0, progress);
        uvs.push(1, progress);
      }

      for (let i = 0; i < segments; i++) {
        const a = i * 2;
        const b = i * 2 + 1;
        const c = (i + 1) * 2;
        const d = (i + 1) * 2 + 1;

        indices.push(a, b, c);
        indices.push(b, d, c);
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();

      return geo;
    }

    // Função para criar uma barreira/pilha de pneus 3D
    function createTireMesh() {
      const tireGroup = new THREE.Group();

      // Geometria da borracha do pneu
      const geometry = new THREE.TorusGeometry(0.8, 0.4, 12, 24);
      const material = new THREE.MeshStandardMaterial({
        color: 0x1a1a1a, // Preto borracha
        roughness: 0.9,
        metalness: 0.1
      });

      // Pneu de baixo
      const tire1 = new THREE.Mesh(geometry, material);
      tire1.rotation.x = Math.PI / 2;
      tire1.position.y = 0.4;
      tire1.castShadow = true;
      tire1.receiveShadow = true;
      tireGroup.add(tire1);

      // Pneu de cima (empilhado)
      const tire2 = tire1.clone();
      tire2.position.y = 1.1;
      tireGroup.add(tire2);

      return tireGroup;
    }

    const trackTexCanvas = document.createElement('canvas');
    trackTexCanvas.width = 64; trackTexCanvas.height = 256;
    const tctx = trackTexCanvas.getContext('2d');
    tctx.fillStyle = '#4a4a52'; tctx.fillRect(0, 0, 64, 256);
    tctx.strokeStyle = 'rgba(255,255,255,0.55)';
    tctx.lineWidth = 2;
    tctx.setLineDash([14, 14]);
    tctx.beginPath(); tctx.moveTo(32, 0); tctx.lineTo(32, 256); tctx.stroke();
    tctx.strokeStyle = 'rgba(255,255,255,0.9)'; tctx.setLineDash([]);
    tctx.lineWidth = 1;
    tctx.beginPath();
    // Linha lateral esquerda
    tctx.moveTo(2, 0);
    tctx.lineTo(2, 256);

    // Linha lateral direita
    tctx.moveTo(62, 0);
    tctx.lineTo(62, 256);
    tctx.stroke();
    const trackTexture = new THREE.CanvasTexture(trackTexCanvas);
    trackTexture.wrapS = THREE.RepeatWrapping;
    trackTexture.wrapT = THREE.RepeatWrapping;

    trackTexture.repeat.set(1, 10); // Repete a textura 40 vezes ao longo do comprimento
    trackTexture.needsUpdate = true; // Força a atualização da textura no Three.js

    const trackMesh = new THREE.Mesh(
      buildTrackMesh(),
      new THREE.MeshStandardMaterial({ map: trackTexture, roughness: 0.9, side: THREE.DoubleSide })
    );
    trackMesh.receiveShadow = true;
    scene.add(trackMesh);

    // Grama ao redor
    const grass = new THREE.Mesh(
      new THREE.PlaneGeometry(600, 600),
      new THREE.MeshStandardMaterial({ color: 0x5a9c4a, roughness: 1 })
    );
    grass.rotation.x = -Math.PI / 2;
    grass.position.y = -0.02;
    grass.receiveShadow = true;
    scene.add(grass);

    // Zebras (cones de borda) para referência visual de curva
    // function addCones() {
    //   const coneGeo = new THREE.ConeGeometry(0.6, 1.2, 8);
    //   for (let i = 0; i < 90; i++) {
    //     const t = i / 90;
    //     const point = trackCurve.getPointAt(t);
    //     const tangent = trackCurve.getTangentAt(t).normalize();
    //     const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
    //     for (const side of [1, -1]) {
    //       const pos = point.clone().addScaledVector(normal, side * (trackWidth / 2 + 0.8));
    //       const mat = new THREE.MeshStandardMaterial({ color: (i % 2 === 0) ? 0xff5722 : 0xffffff });
    //       const cone = new THREE.Mesh(coneGeo, mat);
    //       cone.position.set(pos.x, 0.6, pos.z);
    //       cone.castShadow = true;
    //       scene.add(cone);
    //     }
    //   }
    // }
    // addCones();
    function createStripedTireTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      // Cor base do pneu (Preto borracha)
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(0, 0, 128, 128);

      // Listras/Linhas brancas alternadas
      ctx.fillStyle = '#ff5722';
      ctx.fillRect(0, 20, 128, 25);
      ctx.fillRect(0, 75, 128, 25);

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    // 2. Materiais: Preto total e Preto com linhas brancas
    const blackTireMat = new THREE.MeshStandardMaterial({
      color: 0x1a1a1a,
      roughness: 0.8
    });

    const stripedTireMat = new THREE.MeshStandardMaterial({
      map: createStripedTireTexture(),
      roughness: 0.8
    });

    // 3. Função para adicionar os pneus alternando os estilos
    function addTires() {
      const tireGeo = new THREE.TorusGeometry(0.5, 0.25, 12, 24);

      for (let i = 0; i < 120; i++) {
        const t = i / 120;
        const point = trackCurve.getPointAt(t);
        const tangent = trackCurve.getTangentAt(t).normalize();
        const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

        // Alterna o material entre preto total e preto com linhas brancas
        const currentMat = (i % 2 === 0) ? blackTireMat : stripedTireMat;

        for (const side of [1, -1]) {
          const pos = point.clone().addScaledVector(normal, side * (trackWidth / 2 + 0.8));

          const tireStack = new THREE.Group();

          // Pneu inferior
          const tireBottom = new THREE.Mesh(tireGeo, currentMat);
          tireBottom.rotation.x = Math.PI / 2;
          tireBottom.position.y = 0.25;
          tireBottom.castShadow = true;
          tireStack.add(tireBottom);

          // Pneu superior
          const tireTop = tireBottom.clone();
          tireTop.position.y = 0.7;
          tireStack.add(tireTop);

          tireStack.position.set(pos.x, 0, pos.z);
          scene.add(tireStack);
        }
      }
    }

    addTires();

    // Faixa quadriculada de largada/chegada, marcando o t=0 da curva (mesmo ponto
    // onde o kart nasce e onde a volta é contada)
    function addStartFinishLine() {
      const point = trackCurve.getPointAt(0);
      const tangent = trackCurve.getTangentAt(0).normalize();
      const heading = Math.atan2(tangent.x, tangent.z);

      const c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      const cctx = c.getContext('2d');
      const squares = 8, sq = 64 / squares;
      for (let y = 0; y < squares; y++) {
        for (let x = 0; x < squares; x++) {
          cctx.fillStyle = ((x + y) % 2 === 0) ? '#ffffff' : '#101010';
          cctx.fillRect(x * sq, y * sq, sq, sq);
        }
      }
      const checkerTex = new THREE.CanvasTexture(c);

      const stripe = new THREE.Mesh(
        new THREE.PlaneGeometry(trackWidth, 2.4),
        new THREE.MeshStandardMaterial({ map: checkerTex })
      );
      stripe.rotation.x = -Math.PI / 2;
      stripe.rotation.z = heading;
      stripe.position.set(point.x, 0.02, point.z);
      stripe.receiveShadow = true;
      scene.add(stripe);

      // Placa "LARGADA/CHEGADA" logo acima da faixa
      const signCanvas = document.createElement('canvas');
      signCanvas.width = 512; signCanvas.height = 96;
      const sctx = signCanvas.getContext('2d');
      sctx.fillStyle = 'rgba(20,20,20,0.85)';
      sctx.fillRect(0, 0, 512, 96);
      sctx.fillStyle = '#FFD54F';
      sctx.font = 'bold 46px sans-serif';
      sctx.textAlign = 'center';
      sctx.textBaseline = 'middle';
      sctx.fillText('LARGADA / CHEGADA', 256, 48);
      const signTex = new THREE.CanvasTexture(signCanvas);
      const sign = new THREE.Mesh(
        new THREE.PlaneGeometry(16, 3),
        new THREE.MeshBasicMaterial({ map: signTex, transparent: true, side: THREE.DoubleSide })
      );
      sign.position.set(point.x, 6, point.z);
      sign.rotation.y = -heading;
      scene.add(sign);
    }
    addStartFinishLine();

    // ------------------------------------------------------------
    // CARREGAMENTO DO KART (Arquivo Externo)
    // ------------------------------------------------------------
    const gltfLoader = new THREE.GLTFLoader();

    // Função utilitária para carregar o modelo como uma Promise
    function loadKartModel() {
      return new Promise((resolve, reject) => {
        try {
          // Converte a string do arquivo separado em ArrayBuffer
          const buffer = base64ToArrayBuffer(window.KART_MODEL_BASE64);

          // Usa .parse() para ler diretamente o buffer do .glb
          gltfLoader.parse(
            buffer,
            '', // Path relativo (deixe vazio)
            (gltf) => resolve(gltf.scene),
            (error) => reject(error)
          );
        } catch (err) {
          reject(err);
        }
      });
    }
    // Ajustes finos do modelo — se o kart nascer de lado ou de costas, mude o
    // KART_MODEL_YAW_OFFSET (em radianos: Math.PI = 180°, Math.PI/2 = 90°).
    const KART_MODEL_SCALE = 2.2;
    const KART_MODEL_YAW_OFFSET = 0;

    function base64ToArrayBuffer(base64) {
      // 1. Remove o prefixo Data URL caso ele exista na string
      const cleanBase64 = base64.replace(/^data:.*?;base64,/, '').trim();

      // 2. Decodifica a string limpa
      const binaryString = window.atob(cleanBase64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);

      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      return bytes.buffer;
    }

    let kartModelTemplate = null;
    const pendingModelUpgrades = []; // karts criados antes do modelo terminar de carregar

    function buildEmergencyFallback(color) {
      // Só aparece se o .glb falhar ao carregar (nunca deveria acontecer já que
      // está embutido no próprio arquivo, mas evita tela em branco se acontecer).
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1.4, 0.9, 2.2),
        new THREE.MeshStandardMaterial({ color })
      );
      mesh.position.y = 0.45;
      mesh.castShadow = true;
      return mesh;
    }

    function applyKartModel(group) {
      while (group.children.length) group.remove(group.children[0]);
      const instance = kartModelTemplate.clone(true);
      instance.scale.setScalar(KART_MODEL_SCALE);
      instance.rotation.y = KART_MODEL_YAW_OFFSET;
      instance.traverse((obj) => { if (obj.isMesh) { obj.castShadow = true; obj.receiveShadow = true; } });
      group.add(instance);
    }


    gltfLoader.parse(base64ToArrayBuffer(KART_MODEL_BASE64), '', (gltf) => {
      kartModelTemplate = gltf.scene;
      pendingModelUpgrades.forEach(applyKartModel);
      pendingModelUpgrades.length = 0;
    }, (err) => {
      console.error('[GLB] Falha ao carregar o modelo do kart, mantendo caixa de emergência:', err);
    });

    function createKart(chassisColor) {
      const group = new THREE.Group();
      if (kartModelTemplate) {
        applyKartModel(group);
      } else {
        group.add(buildEmergencyFallback(chassisColor));
        pendingModelUpgrades.push(group);
      }
      scene.add(group);
      return { group, wheels: [] };
    }

    // ------------------------------------------------------------
    // KART DO JOGADOR LOCAL
    // ------------------------------------------------------------
    const localKartObj = createKart(0xE53935);
    const kart = localKartObj.group;
    const wheels = localKartObj.wheels;

    // Posição inicial na pista
    const startPoint = trackCurve.getPointAt(0);
    const startTangent = trackCurve.getTangentAt(0);
    kart.position.copy(startPoint);
    kart.rotation.y = Math.atan2(startTangent.x, startTangent.z);


    // ------------------------------------------------------------
    // FÍSICA DO KART
    // ------------------------------------------------------------
    const physics = {
      velocity: new THREE.Vector3(),
      speed: 0,
      heading: kart.rotation.y,
      maxSpeed: 32,
      maxReverse: -10,
      accel: 22,
      brakeDecel: 30,
      friction: 10,
      turnSpeed: 2.4,
      driftFactor: 0,          // 0..1, quanto mais perto de 1, mais "escorrega"
      isDrifting: false,
      driftDirection: 0,       // -1 esquerda, 1 direita
      driftCharge: 0,          // tempo acumulado de drift
      turboTimer: 0,           // boost ativo restante
    };

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    const TOTAL_LAPS = 3;
    const speedfill = document.getElementById('speedfill');
    const turboLabel = document.getElementById('turboLabel');
    const lapcountEl = document.getElementById('lapcount');
    const standingsListEl = document.getElementById('standingsList');
    document.getElementById('totallaps').textContent = TOTAL_LAPS;

    function updatePhysics(dt) {
      const raceOver = raceTrackers.get('local')?.finished;
      const forward = !raceOver && (keys['KeyW'] || keys['ArrowUp']);
      const backward = !raceOver && (keys['KeyS'] || keys['ArrowDown']);
      const left = !raceOver && (keys['KeyA'] || keys['ArrowLeft']);
      const right = !raceOver && (keys['KeyD'] || keys['ArrowRight']);
      const driftKey = !raceOver && keys['Space'];

      // Aceleração / freio
      if (forward) {
        physics.speed += physics.accel * dt;
      } else if (backward) {
        physics.speed -= physics.brakeDecel * dt;
      } else {
        // atrito natural
        if (physics.speed > 0) physics.speed = Math.max(0, physics.speed - physics.friction * dt);
        else if (physics.speed < 0) physics.speed = Math.min(0, physics.speed + physics.friction * dt);
      }

      // Boost de turbo
      let currentMax = physics.maxSpeed;
      if (physics.turboTimer > 0) {
        physics.turboTimer -= dt;
        currentMax *= 1.4;
      }

      physics.speed = THREE.MathUtils.clamp(physics.speed, physics.maxReverse, currentMax);

      // Direção / drift
      const turnInput = (left ? 1 : 0) - (right ? 1 : 0);
      const movingFactor = THREE.MathUtils.clamp(Math.abs(physics.speed) / physics.maxSpeed, 0.15, 1);

      const canDrift = driftKey && (left || right) && Math.abs(physics.speed) > physics.maxSpeed * 0.4;

      if (canDrift && !backward) {
        if (!physics.isDrifting) {
          physics.isDrifting = true;
          physics.driftDirection = turnInput !== 0 ? Math.sign(turnInput) : (left ? 1 : -1);
          physics.driftCharge = 0;
        }
        physics.driftCharge += dt;
        // Durante o drift, vira mais e desliza (drift factor sobe)
        physics.heading += physics.driftDirection * physics.turnSpeed * 0.6 * movingFactor * dt;
        physics.driftFactor = Math.min(1, physics.driftFactor + dt * 2);
      } else {
        if (physics.isDrifting) {
          // soltou o drift: dispara mini-turbo conforme carga acumulada
          if (physics.driftCharge > 1.6) {
            physics.turboTimer = 1.1;
            flashTurbo();
          } else if (physics.driftCharge > 0.8) {
            physics.turboTimer = 0.55;
            flashTurbo();
          }
        }
        physics.isDrifting = false;
        physics.driftCharge = 0;
        physics.driftFactor = Math.max(0, physics.driftFactor - dt * 3);
        physics.heading += turnInput * physics.turnSpeed * movingFactor * dt;
      }

      // Vetor de movimento: mistura heading "real" com um pouco de deslizamento lateral durante drift
      const forwardDir = new THREE.Vector3(Math.sin(physics.heading), 0, Math.cos(physics.heading));
      const slideBlend = physics.driftFactor * 0.35;
      const slipHeading = physics.heading - physics.driftDirection * slideBlend;
      const moveDir = new THREE.Vector3(Math.sin(slipHeading), 0, Math.cos(slipHeading));

      kart.position.addScaledVector(moveDir, physics.speed * dt);
      kart.rotation.y = physics.heading;

      enforceTrackBoundary();

      // Efeito visual de inclinação no drift
      const targetTilt = physics.isDrifting ? physics.driftDirection * 0.18 : 0;
      kart.rotation.z += (targetTilt - kart.rotation.z) * Math.min(1, dt * 6);

      // Rodinhas girando (puramente estético)
      wheels.forEach(w => w.rotation.x -= physics.speed * dt * 2);

      // HUD velocidade
      const pct = THREE.MathUtils.clamp((physics.speed / (physics.maxSpeed * 1.4)) * 100, 0, 100);
      speedfill.style.width = pct + '%';
    }

    let turboFlashTimer = 0;
    function flashTurbo() {
      turboLabel.style.opacity = '1';
      turboFlashTimer = 0.8;
    }

    // ------------------------------------------------------------
    // COLISÃO COM A BORDA DA PISTA (impede "cortar" caminho pela grama)
    // ------------------------------------------------------------
    // Empurra o kart de volta pra dentro da pista sempre que ele passa da metade
    // da largura + uma margem, e absorve a velocidade que ia "pra fora" — como
    // bater numa mureta baixa. O visual dos cones já está nessa mesma margem.
    const BOUNDARY_MARGIN = 0.6;
    const boundaryLimit = trackWidth / 2 + BOUNDARY_MARGIN;

    function enforceTrackBoundary() {
      const { sample } = nearestTrackSample(kart.position);
      const offset = new THREE.Vector3().subVectors(kart.position, sample.point);
      const lateral = offset.dot(sample.normal); // distância assinada do centro da pista

      if (Math.abs(lateral) > boundaryLimit) {
        const sign = Math.sign(lateral);
        // Reposiciona exatamente na borda
        const corrected = sample.point.clone().addScaledVector(sample.normal, sign * boundaryLimit);
        // Mantém a componente ao longo da pista (offset - lateral*normal), só recorta o excesso lateral
        const along = offset.clone().addScaledVector(sample.normal, -lateral);
        kart.position.copy(sample.point.clone().add(along).addScaledVector(sample.normal, sign * boundaryLimit));

        // "Bate na mureta": perde parte da velocidade, como se tivesse raspado
        physics.speed *= 0.55;
      }
    }

    // ------------------------------------------------------------
    // PROGRESSO DE CORRIDA (volta, posição de cada corredor e fim de corrida)
    // ------------------------------------------------------------
    // Um "tracker" por corredor (local + cada amigo conectado), todos alimentados
    // pela mesma amostragem da pista — assim dá pra ordenar quem está em que posição
    // e detectar corretamente quando alguém (inclusive o jogador local) termina a prova.
    const raceTrackers = new Map(); // key ('local' ou peerId) -> { lapCount, lastT, progress, finished, finishTime }

    function updateRaceTracker(key, position) {
      let tr = raceTrackers.get(key);
      if (!tr) {
        tr = { lapCount: 1, lastT: 0, progress: 0, finished: false, finishTime: null };
        raceTrackers.set(key, tr);
      }
      if (tr.finished) return tr;

      const t = nearestTrackSample(position).sample.t;
      // Cruzou a linha de largada/chegada (t voltando de perto de 1 pra perto de 0)
      if (tr.lastT > 0.85 && t < 0.15) {
        if (tr.lapCount >= TOTAL_LAPS) {
          tr.finished = true;
          tr.finishTime = performance.now();
        } else {
          tr.lapCount++;
        }
      }
      tr.lastT = t;
      tr.progress = tr.finished ? TOTAL_LAPS : (tr.lapCount - 1) + t;
      return tr;
    }

    function updateStandingsHUD() {
      const rows = [{ key: 'local', label: 'Você', tr: raceTrackers.get('local') }];
      for (const pid of remoteKarts.keys()) {
        rows.push({ key: pid, label: friendLabel(pid), tr: raceTrackers.get(pid) });
      }
      rows.forEach(r => { if (!r.tr) r.tr = { progress: 0, finished: false, finishTime: Infinity }; });

      rows.sort((a, b) => {
        if (a.tr.finished && b.tr.finished) return a.tr.finishTime - b.tr.finishTime;
        if (a.tr.finished) return -1;
        if (b.tr.finished) return 1;
        return b.tr.progress - a.tr.progress;
      });

      if (standingsListEl) {
        standingsListEl.innerHTML = rows
          .map((r, i) => `${i + 1}º ${r.label}${r.tr.finished ? ' 🏁' : ''}`)
          .join('<br>');
      }

      return rows;
    }

    let localFinishNotified = false;
    function showFinishOverlay(place, totalRacers) {
      const overlay = document.createElement('div');
      overlay.id = 'finishOverlay';
      overlay.innerHTML = `
    <h1 style="margin:0;">🏁 Corrida Finalizada!</h1>
    <div style="font-size:20px;">Você terminou em ${place}º lugar${totalRacers > 1 ? ' de ' + totalRacers : ''}!</div>
    <button id="btnRestart" class="lobbyBtn">Jogar novamente</button>
  `;
      document.body.appendChild(overlay);
      document.getElementById('btnRestart').onclick = () => location.reload();
    }

    let hudTimer = 0;

    // ------------------------------------------------------------
    // SISTEMA DE ÁUDIO
    // ------------------------------------------------------------
    const sounds = {
      engine: new Audio('https://assets.mixkit.co/active_storage/sfx/2808/2808-preview.mp3'),
      brake: new Audio('https://assets.mixkit.co/active_storage/sfx/2809/2809-preview.mp3'),
      hit: new Audio('https://assets.mixkit.co/active_storage/sfx/2810/2810-preview.mp3')
    };

    // Configurações iniciais
    sounds.engine.loop = true;
    sounds.engine.volume = 0.3;

    sounds.brake.loop = true;
    sounds.brake.volume = 0.4;

    sounds.hit.volume = 0.6;

    // Libera o áudio no primeiro clique do usuário (exigência dos navegadores)
    let audioInitialized = false;
    window.addEventListener('click', () => {
      if (!audioInitialized) {
        sounds.engine.play().catch(() => { });
        sounds.engine.pause();
        audioInitialized = true;
      }
    }, { once: true });

    function updateAudio(physics, keys) {
      if (!audioInitialized) return;

      const currentSpeed = Math.abs(physics.speed || 0);
      const isAccelerating = keys['ArrowUp'] || keys['w'] || keys['W'];
      const isBraking = keys['ArrowDown'] || keys['s'] || keys['S'];

      // 1. Som do Motor (Ajusta o tom/pitch conforme a velocidade)
      if (currentSpeed > 0.1 || isAccelerating) {
        if (sounds.engine.paused) sounds.engine.play().catch(() => { });
        // Altera a velocidade do áudio proporcionalmente à velocidade do kart
        sounds.engine.playbackRate = Math.min(2.0, Math.max(0.8, 0.8 + (currentSpeed / 50)));
      } else {
        sounds.engine.pause();
      }

      // 2. Som de Frenagem e Derrapagem
      if (isBraking && currentSpeed > 2.0) {
        if (sounds.brake.paused) sounds.brake.play().catch(() => { });
      } else {
        sounds.brake.pause();
      }
    }


    // ------------------------------------------------------------
    // CONFIGURAÇÃO DO ZOOM FIXO DA CÂMERA
    // ------------------------------------------------------------
    const ZOOM_LEVELS = [20, 25]; // Ângulos de FOV: Próximo, Médio, Distante
    let currentZoomIndex = 1; // Inicia no padrão (65)

    // Alterna o zoom ao pressionar a tecla 'C'
    window.addEventListener('keydown', (event) => {
      if (event.key.toLowerCase() === 'c') {
        currentZoomIndex = (currentZoomIndex + 1) % ZOOM_LEVELS.length;
        camera.fov = ZOOM_LEVELS[currentZoomIndex];
        camera.updateProjectionMatrix();
      }
    });

    // ------------------------------------------------------------
    // CÂMERA - segue o kart atrás e um pouco acima
    // ------------------------------------------------------------
    const camOffset = new THREE.Vector3(0, 5, -9);

    function updateCamera(dt) {
      const desired = kart.position.clone().add(
        camOffset.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), physics.heading)
      );
      desired.y = kart.position.y + 5;
      camera.position.lerp(desired, Math.min(1, dt * 4));

      const lookAt = kart.position.clone();
      lookAt.y += 1.2;
      camera.lookAt(lookAt);

      // Mantém o FOV fixo sem alterações dinâmicas por aceleração
      if (camera.fov !== ZOOM_LEVELS[currentZoomIndex]) {
        camera.fov = ZOOM_LEVELS[currentZoomIndex];
        camera.updateProjectionMatrix();
      }
    }

    // ------------------------------------------------------------
    // MULTIPLAYER (PeerJS, WebRTC P2P) — topologia estrela:
    // os convidados só falam com o host; o host retransmite o estado de
    // todo mundo pra todo mundo. Isso evita ter que hospedar um servidor.
    // ------------------------------------------------------------
    const remoteKarts = new Map(); // peerId -> { obj: {group,wheels}, target: {...} }
    const REMOTE_COLORS = [0x1E88E5, 0x43A047, 0x8E24AA, 0xFB8C00, 0x00ACC1, 0xD81B60];

    function remoteColorFromId(id) {
      let hash = 0;
      for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) >>> 0;
      return REMOTE_COLORS[hash % REMOTE_COLORS.length];
    }

    function getOrCreateRemoteKart(peerId) {
      if (remoteKarts.has(peerId)) return remoteKarts.get(peerId);
      const obj = createKart(remoteColorFromId(peerId));
      const entry = { obj, target: { pos: obj.group.position.clone(), ry: 0, rz: 0, speed: 0 } };
      remoteKarts.set(peerId, entry);
      updateConnStatus();
      return entry;
    }

    function removeRemoteKart(peerId) {
      const entry = remoteKarts.get(peerId);
      if (!entry) return;
      scene.remove(entry.obj.group);
      remoteKarts.delete(peerId);
      updateConnStatus();
    }

    function shortestAngleDiff(a, b) {
      let d = (b - a) % (Math.PI * 2);
      if (d > Math.PI) d -= Math.PI * 2;
      if (d < -Math.PI) d += Math.PI * 2;
      return d;
    }

    function randomRoomCode(len = 5) {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sem caracteres ambíguos (O/0, I/1)
      let s = '';
      for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
      return s;
    }

    let peer = null;
    let isHost = false;
    let hostConnection = null;          // convidado -> conexão com o host
    const guestConnections = new Map(); // host -> peerId -> conexão

    const lobbyEl = document.getElementById('lobby');
    const lobbyStatusEl = document.getElementById('lobbyStatus');
    const roomCodeEl = document.getElementById('roomCodeDisplay');
    const connStatusEl = document.getElementById('connStatus');
    const playerListEl = document.getElementById('playerList');
    const btnStartRaceEl = document.getElementById('btnStartRace');

    function friendLabel(peerId) {
      return 'Amigo ' + peerId.replace('pkart-', '').slice(-4).toUpperCase();
    }

    function renderPlayerList(players) {
      playerListEl.innerHTML = players
        .map(p => `• ${p.label}${p.id === peer.id ? ' (você)' : ''}`)
        .join('<br>');
    }

    // Só o host manda essa lista; ele reconstrói do zero a cada mudança de conexão
    function broadcastRoster() {
      const players = [{ id: peer.id, label: 'Host' }];
      for (const pid of guestConnections.keys()) players.push({ id: pid, label: friendLabel(pid) });
      renderPlayerList(players);
      const payload = { t: 'roster', players };
      for (const conn of guestConnections.values()) if (conn.open) conn.send(payload);
    }

    function updateConnStatus() {
      if (!peer) { connStatusEl.textContent = ''; return; }
      if (isHost) {
        connStatusEl.textContent = `Hospedando sala • ${remoteKarts.size} amigo(s) conectado(s)`;
      } else if (hostConnection) {
        connStatusEl.textContent = hostConnection.open ? 'Conectado à sala' : 'Conectando...';
      }
    }

    function handleGuestData(peerId, data) {
      if (data.t !== 'state') return;
      const entry = getOrCreateRemoteKart(peerId);
      entry.target.pos.set(data.x, data.y, data.z);
      entry.target.ry = data.ry;
      entry.target.rz = data.rz;
      entry.target.speed = data.speed;
    }

    function handleHostData(data) {
      if (data.t === 'roster') { renderPlayerList(data.players); return; }
      if (data.t === 'start') { lobbyEl.style.display = 'none'; return; }
      if (data.t !== 'snapshot') return;
      for (const [peerId, s] of Object.entries(data.karts)) {
        if (peerId === peer.id) continue; // é o próprio jogador, ignora
        const entry = getOrCreateRemoteKart(peerId);
        entry.target.pos.set(s.x, s.y, s.z);
        entry.target.ry = s.ry;
        entry.target.rz = s.rz;
        entry.target.speed = s.speed;
      }
    }

    function startHosting() {
      lobbyStatusEl.textContent = 'Criando sala...';
      const code = randomRoomCode();
      peer = new Peer('pkart-' + code.toLowerCase());
      peer.on('open', () => {
        isHost = true;
        roomCodeEl.style.display = 'block';
        roomCodeEl.textContent = code;
        btnStartRaceEl.style.display = 'inline-block';
        lobbyStatusEl.textContent = 'Sala criada! Mande esse código pros seus amigos.';
        broadcastRoster();
        updateConnStatus();
      });
      peer.on('connection', (conn) => {
        guestConnections.set(conn.peer, conn);
        conn.on('data', (data) => handleGuestData(conn.peer, data));
        conn.on('close', () => { guestConnections.delete(conn.peer); removeRemoteKart(conn.peer); broadcastRoster(); updateConnStatus(); });
        conn.on('open', () => broadcastRoster());
        updateConnStatus();
      });
      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          lobbyStatusEl.textContent = 'Código já em uso, tentando outro...';
          startHosting();
        } else {
          lobbyStatusEl.textContent = 'Erro ao criar sala: ' + err.type;
          console.error('[PeerJS]', err);
        }
      });
    }

    function joinRoom(code) {
      lobbyStatusEl.textContent = 'Conectando...';
      peer = new Peer();
      peer.on('open', () => {
        hostConnection = peer.connect('pkart-' + code.trim().toLowerCase());
        hostConnection.on('open', () => {
          lobbyStatusEl.textContent = 'Conectado! Aguardando o host iniciar a corrida...';
          updateConnStatus();
        });
        hostConnection.on('data', handleHostData);
        hostConnection.on('close', () => { lobbyStatusEl.textContent = 'Conexão com a sala perdida.'; });
      });
      peer.on('error', (err) => {
        lobbyStatusEl.textContent = 'Não achei essa sala (código errado ou sala fechada).';
        console.error('[PeerJS]', err);
      });
    }

    document.getElementById('btnHost').onclick = startHosting;
    document.getElementById('btnJoin').onclick = () => { document.getElementById('joinBox').style.display = 'flex'; };
    document.getElementById('btnConnect').onclick = () => {
      const code = document.getElementById('joinCode').value.trim();
      if (code) joinRoom(code);
    };
    document.getElementById('btnPlaySolo').onclick = () => { lobbyEl.style.display = 'none'; };
    btnStartRaceEl.onclick = () => {
      const payload = { t: 'start' };
      for (const conn of guestConnections.values()) if (conn.open) conn.send(payload);
      lobbyEl.style.display = 'none'; // sem isso, o próprio host nunca via a corrida começar
    };

    // Envia o estado local ~12x/s; se for host, também retransmite o snapshot de todo mundo
    let netTimer = 0;
    const NET_INTERVAL = 1 / 12;
    function networkTick(dt) {
      if (!peer || !peer.id) return;
      netTimer += dt;
      if (netTimer < NET_INTERVAL) return;
      netTimer = 0;

      const myState = { x: kart.position.x, y: kart.position.y, z: kart.position.z, ry: physics.heading, rz: kart.rotation.z, speed: physics.speed };

      if (isHost) {
        const karts = { [peer.id]: myState };
        for (const [pid, entry] of remoteKarts) {
          karts[pid] = { x: entry.target.pos.x, y: entry.target.pos.y, z: entry.target.pos.z, ry: entry.target.ry, rz: entry.target.rz, speed: entry.target.speed };
        }
        const payload = { t: 'snapshot', karts };
        for (const conn of guestConnections.values()) {
          if (conn.open) conn.send(payload);
        }
      } else if (hostConnection && hostConnection.open) {
        hostConnection.send({ t: 'state', ...myState });
      }
    }

    // Aproxima suavemente cada kart remoto do último estado recebido (interpolação),
    // pra disfarçar a rede rodando a ~12Hz em vez de 60fps.
    function updateRemoteKarts(dt) {
      for (const entry of remoteKarts.values()) {
        const g = entry.obj.group;
        const smoothing = Math.min(1, dt * 8);
        g.position.lerp(entry.target.pos, smoothing);
        g.rotation.y += shortestAngleDiff(g.rotation.y, entry.target.ry) * smoothing;
        g.rotation.z += (entry.target.rz - g.rotation.z) * smoothing;
        entry.obj.wheels.forEach(w => w.rotation.x -= entry.target.speed * dt * 2);
      }
    }

    // Adicione esta função completa no seu script
    function updateHUD(currentSpeed, maxSpeed, currentLap, position) {
      // Referências dos elementos na tela
      const hudPlayerName = document.getElementById('hud-player-name');
      const hudCurrentLap = document.getElementById('hud-current-lap');
      const hudTotalLaps = document.getElementById('hud-total-laps');
      const hudPosition = document.getElementById('hud-position');
      const hudSpeed = document.getElementById('hud-speed');
      const hudSpeedBar = document.getElementById('hud-speed-bar');

      // Atualiza nome se o elemento existir
      if (hudPlayerName) hudPlayerName.innerText = "VOCÊ";

      // Atualiza as voltas
      if (hudCurrentLap) hudCurrentLap.innerText = currentLap || 1;
      if (hudTotalLaps) hudTotalLaps.innerText = "3";

      // Atualiza a posição (1º, 2º, etc.)
      if (hudPosition) hudPosition.innerText = `${position || 1}º`;

      // Converte a velocidade para KM/H visual
      const displaySpeed = Math.floor(currentSpeed * 3.6); // Ou use * 10 ou * 100 dependendo de quão alto quer o número na tela
      if (hudSpeed) hudSpeed.innerText = displaySpeed;

      // Atualiza a barra de velocidade com gradiente
      if (hudSpeedBar) {
        const speedPercentage = Math.min(100, Math.max(0, ((currentSpeed || 0) / (maxSpeed || 1.5)) * 100));
        hudSpeedBar.style.width = `${speedPercentage}%`;
      }
    }

    // ------------------------------------------------------------
    // LOOP PRINCIPAL
    // ------------------------------------------------------------
    let lastTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      // updateAudio(physics, keys);
      updatePhysics(dt);
      updateCamera(dt);
      updateRemoteKarts(dt);
      networkTick(dt);

      if (turboFlashTimer > 0) {
        turboFlashTimer -= dt;
        if (turboFlashTimer <= 0) turboLabel.style.opacity = '0';
      }

      // Atualiza progresso/posição de todo mundo (local + amigos) a cada poucos frames
      hudTimer += dt;
      if (hudTimer > 0.15) {
        hudTimer = 0;
        const localTr = updateRaceTracker('local', kart.position);
        for (const pid of remoteKarts.keys()) {
          updateRaceTracker(pid, remoteKarts.get(pid).obj.group.position);
        }

        // Atualiza contagem antiga de voltas (se ainda usar)
        if (lapcountEl) lapcountEl.textContent = localTr.lapCount;

        const rows = updateStandingsHUD();

        // -------------------------------------------------------------
        // ATUALIZAÇÃO DA NOVA HUD ANIME
        // -------------------------------------------------------------
        // Encontra a posição do jogador local (1º, 2º, etc.)
        const myRank = rows.findIndex(r => r.key === 'local') + 1 || 1;

        // Substitua o cálculo da velocidade dentro do if (hudTimer > 0.15) por este:
        let currentSpeed = 0;

        // Tenta pegar a velocidade de diferentes estruturas comuns no Three.js
        if (typeof kart.speed !== 'undefined') {
          currentSpeed = kart.speed;
        } else if (kart.velocity && typeof kart.velocity.length === 'function') {
          // Se for um Vector3 (física em 3D)
          currentSpeed = kart.velocity.length();
        } else if (kart.velocity && typeof kart.velocity.z !== 'undefined') {
          currentSpeed = Math.abs(kart.velocity.z);
        } else if (typeof kart.currentSpeed !== 'undefined') {
          currentSpeed = kart.currentSpeed;
        }

        const speed = Math.abs(physics.speed);
        const maxSpd = physics.maxSpeed;
        // Passa os dados para a HUD
        updateHUD(speed, maxSpd, localTr.lapCount, myRank);
        // -------------------------------------------------------------

        if (localTr.finished && !localFinishNotified) {
          localFinishNotified = true;
          const place = rows.findIndex(r => r.key === 'local') + 1;
          showFinishOverlay(place, rows.length);
        }
      }

      renderer.render(scene, camera);
    }
    animate();
  </script>
