<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Kart - Lobby</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle, #2c3e50 0%, #0f172a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    /* Layout Lado a Lado dos Modais */
    #lobbyMainContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 20px;
      z-index: 100;
    }

    /* Estilo Padronizado dos Modais */
    .lobbyCard {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 360px;
      min-height: 520px;
      height: auto;
      box-sizing: border-box;
    }

    .selectNavBtn {
      background: #334155;
      border: 1px solid #475569;
      color: #FFD54F;
      font-size: 16px;
      font-weight: bold;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s;
    }

    .selectNavBtn:hover {
      background: #475569;
      transform: scale(1.05);
    }

    .lobbyBtn {
      background: #22c55e;
      color: #0f172a;
      border: none;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      flex: 1;
    }

    .lobbyBtn:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .lobbyBtnGhost {
      background: transparent;
      color: #38bdf8;
      border: 1px solid #38bdf8;
    }

    .lobbyBtnGhost:hover {
      background: rgba(56, 189, 248, 0.1);
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      text-align: center;
      font-size: 14px;
      outline: none;
    }

    /* Scrollbar Estilizada */
    #leaderboardList::-webkit-scrollbar {
      width: 6px;
    }

    #leaderboardList::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <!-- Modal de Autenticação -->
  <div id="authModal"
    style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.95); display: flex; align-items: center; justify-content: center; z-index: 1000;">
    <div
      style="background: #1e293b; padding: 32px; border-radius: 16px; border: 1px solid #334155; width: 320px; color: #fff; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
      <h2 id="authTitle" style="margin-bottom: 20px; color: #facc15;">Criar Conta</h2>

      <input type="text" id="authNick" placeholder="Seu Nickname"
        style="width: 100%; padding: 12px; margin-bottom: 12px; box-sizing: border-box;" />
      <input type="email" id="authEmail" placeholder="Seu E-mail"
        style="width: 100%; padding: 12px; margin-bottom: 12px; box-sizing: border-box;" />
      <input type="password" id="authPassword" placeholder="Sua Senha"
        style="width: 100%; padding: 12px; margin-bottom: 20px; box-sizing: border-box;" />

      <button id="btnAuthSubmit"
        style="width: 100%; padding: 14px; background: #22c55e; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-bottom: 12px;">CADASTRAR</button>

      <div style="font-size: 14px; color: #94a3b8; cursor: pointer;" id="toggleAuthMode">Já tem uma conta? Entrar</div>
    </div>
  </div>

  <!-- CONTAINER PRINCIPAL (LOBBY + RANKING) -->
  <div id="lobbyMainContainer">

    <!-- MODAL 1: LOBBY DE JOGO -->
    <div class="lobbyCard">
      <h2 style="margin: 0; color: #facc15; font-size: 20px;">🏎️ Pokémon Kart</h2>

      <!-- Input de Nickname (Preenchido pelo Supabase) -->
      <input type="text" id="playerNicknameInput" value="Carregando..." disabled readonly
        style="width: 100%; color: #facc15; font-weight: bold; cursor: not-allowed;" />

      <!-- Badges de Economia -->
      <div
        style="width: 100%; display: flex; justify-content: space-around; background: #0f172a; padding: 8px; border-radius: 8px; border: 1px solid #334155;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 16px;">🪙</span>
          <span id="playerCoinsText" style="font-weight: bold; color: #facc15; font-size: 14px;">0</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 16px;">🏆</span>
          <span id="playerTrophiesText" style="font-weight: bold; color: #38bdf8; font-size: 14px;">0</span>
        </div>
      </div>

      <!-- Seletor 3D de Kart -->
      <div id="kartSelector" style="display: flex; align-items: center; gap: 10px;">
        <button id="btnPrevKart" class="selectNavBtn">◀</button>
        <div style="text-align: center;">
          <div id="previewContainer"
            style="width: 200px; height: 120px; background: #0f172a; border-radius: 8px; border: 1px solid #334155; position: relative; overflow: hidden;">
            <div id="previewSpinner" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #94a3b8; font-size: 12px; pointer-events: none; font-weight: bold;">Carregando...</div>
          </div>
          <div id="kartName" style="margin-top: 4px; font-weight: bold; color: #38bdf8; font-size: 13px;">Jolteon Kart
          </div>
        </div>
        <button id="btnNextKart" class="selectNavBtn">▶</button>
      </div>

      <!-- Controles de Sala Multiplayer -->
      <div style="display: flex; gap: 8px; width: 100%;">
        <button id="btnHost" class="lobbyBtn" style="background: #38bdf8;">Criar Sala</button>
        <button id="btnJoin" class="lobbyBtn lobbyBtnGhost">Entrar em Sala</button>
      </div>

      <div id="joinBox" style="display: none; gap: 5px; width: 100%;">
        <input id="joinCode" placeholder="CÓDIGO" maxlength="5" style="text-transform: uppercase; width: 60%;">
        <button id="btnConnect" class="lobbyBtn" style="width: 40%;">Conectar</button>
      </div>

      <div id="roomCodeDisplay" style="display:none; color: #22c55e; font-weight: bold; font-size: 15px;"></div>
      <div id="lobbyStatus" style="color: #94a3b8; font-size: 12px; min-height: 16px;"></div>

      <!-- Seletor de Pista -->
      <div style="width: 100%; display: flex; flex-direction: column; gap: 4px;">
        <label style="font-size: 11px; color: #94a3b8; font-weight: bold;">ESCOLHA A PISTA:</label>
        <select id="trackSelectDropdown" style="width: 100%; background: #0f172a; border: 1px solid #334155; color: #facc15; font-weight: bold; padding: 8px 10px; border-radius: 8px; font-size: 13px; outline: none; cursor: pointer;">
          <option value="">🏁 Circuito Oficial (Padrão)</option>
        </select>
      </div>

      <div style="display: flex; gap: 8px; width: 100%;">
        <button id="btnStartRace" class="lobbyBtn" style="display:none;">Iniciar Corrida 🏁</button>
        <button id="btnPlaySolo" class="lobbyBtn lobbyBtnGhost" style="width: 100%;">Jogar Sozinho</button>
      </div>

      <!-- Ações Extras: Garagem e Criador de Pistas -->
      <div style="display: flex; gap: 8px; width: 100%;">
        <button id="btnOpenGarage"
          style="flex: 1; padding: 10px; background: #facc15; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; transition: 0.2s;">
          🛠️ GARAGEM
        </button>
        <button id="btnOpenTrackBuilder"
          style="flex: 1; padding: 10px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; transition: 0.2s;">
          🎨 PISTAS
        </button>
      </div>
    </div>

    <!-- MODAL 2: RANKING GLOBAL DE TROFÉUS -->
    <div class="lobbyCard" style="align-items: stretch;">
      <h3
        style="color: #38bdf8; font-size: 18px; text-align: center; margin: 0 0 4px 0; display: flex; align-items: center; justify-content: center; gap: 8px;">
        🏆 RANKING GLOBAL
      </h3>

      <!-- Cabeçalho da Tabela -->
      <div
        style="display: flex; justify-content: space-between; padding: 8px 12px; background: #0f172a; border-radius: 8px 8px 0 0; font-size: 12px; color: #94a3b8; font-weight: bold; border: 1px solid #334155; border-bottom: none;">
        <span>POS. JOGADOR</span>
        <span>TROFÉUS</span>
      </div>

      <!-- Lista de Jogadores com Scroll Vertical -->
      <div id="leaderboardList"
        style="flex: 1; overflow-y: auto; padding-right: 4px; display: flex; flex-direction: column; gap: 6px; background: #0f172a; border-radius: 0 0 8px 8px; border: 1px solid #334155; padding: 8px;">
        <div style="text-align: center; color: #94a3b8; font-size: 13px; padding-top: 20px;">Carregando ranking...</div>
      </div>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="assets.js"></script>
  <script src="auth.js"></script>

  <script>
    const gltfLoader = new THREE.GLTFLoader();
    if (typeof THREE.DRACOLoader !== 'undefined') {
      const dracoLoader = new THREE.DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
      gltfLoader.setDRACOLoader(dracoLoader);
    }

    function getKartUrl(filename) {
      return `./models/${filename}`;
    }

    const KART_DATABASE = [
      { id: 'jolteon', name: 'Jolteon Kart', modelUrl: getKartUrl('jolteon.glb') },
      { id: 'zoroark', name: 'Zoroark Kart', modelUrl: getKartUrl('zoroark.glb') },
      { id: 'togetic', name: 'Togetic Kart', modelUrl: getKartUrl('togetic.glb') },
      { id: 'charizard', name: 'Charizard Kart', modelUrl: getKartUrl('charizard.glb') },
      { id: 'flygon', name: 'Flygon Kart', modelUrl: getKartUrl('flygon.glb') },
      { id: 'gengar', name: 'Gengar Kart', modelUrl: getKartUrl('gengar.glb') },
      { id: 'oshawott', name: 'Oshawott Kart', modelUrl: getKartUrl('oshawott.glb') },
      { id: 'snorlax', name: 'Snorlax Kart', modelUrl: getKartUrl('snorlax.glb') },
      // Novos Karts
      { id: 'golem', name: 'Golem Kart', modelUrl: getKartUrl('golem.glb') },
      { id: 'jinx', name: 'Jynx Kart', modelUrl: getKartUrl('jinx.glb') },
      { id: 'sudowoodo', name: 'Sudowoodo Kart', modelUrl: getKartUrl('sudowoodo.glb') },
      { id: 'sylveon', name: 'Sylveon Kart', modelUrl: getKartUrl('sylveon.glb') },
      { id: 'umbreon', name: 'Umbreon Kart', modelUrl: getKartUrl('umbreon.glb') },
      { id: 'pikachu', name: 'Pikachu Kart', modelUrl: getKartUrl('pikachu.glb') },
      { id: 'gliscor', name: 'Gliscor Kart', modelUrl: getKartUrl('gliscor.glb') },
      { id: 'mewtwo', name: 'Mewtwo Kart', modelUrl: getKartUrl('mewtwo.glb') },
      { id: 'zekrom', name: 'Zekrom Kart', modelUrl: getKartUrl('zekrom.glb') },
      { id: 'swampert', name: 'Swampert Kart', modelUrl: getKartUrl('swampert.glb') },
      { id: 'rayquaza', name: 'Rayquaza Kart', modelUrl: getKartUrl('rayquaza.glb') },
      { id: 'espeon', name: 'Espeon Kart', modelUrl: getKartUrl('espeon.glb') },
      { id: 'tatsugiri', name: 'Tatsugiri Kart', modelUrl: getKartUrl('tatsugiri.glb') },
      { id: 'scyther', name: 'Scyther Kart', modelUrl: getKartUrl('scyther.glb') }
    ];

    const savedKartId = sessionStorage.getItem('pkart_selected_kart');
    let selectedIndex = KART_DATABASE.findIndex(k => k.id === savedKartId);
    if (selectedIndex === -1) selectedIndex = 0; // Padrão inicial definido como 0 (Jolteon)

    // VARIÁVEIS GLOBAIS DA CENA E CONTROLE DE REQUISIÇÃO
    let previewScene, previewCamera, previewRenderer, currentModel;
    let previewRequestId = 0; // DECLARAÇÃO GLOBAL DA VARIÁVEL

    function initPreview() {
      const container = document.getElementById('previewContainer');

      previewScene = new THREE.Scene();
      previewCamera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);

      // ALTERADO: Posição Z mudou de 3.8 para 2.8 para aproximar a visão do kart
      previewCamera.position.set(0, 1.1, 2.8);
      previewCamera.lookAt(0, 0.3, 0);

      previewRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      previewRenderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(previewRenderer.domElement);

      previewScene.add(new THREE.AmbientLight(0xffffff, 1.3));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.6);
      dirLight.position.set(3, 5, 4);
      previewScene.add(dirLight);

      updatePreview();

      function animate() {
        requestAnimationFrame(animate);
        if (currentModel) currentModel.rotation.y += 0.012;
        previewRenderer.render(previewScene, previewCamera);
      }
      animate();
    }

    async function updatePreview() {
      const item = KART_DATABASE[selectedIndex];
      const kartNameEl = document.getElementById('kartName');
      const spinnerEl = document.getElementById('previewSpinner');

      sessionStorage.setItem('pkart_selected_kart', item.id);

      const requestId = ++previewRequestId;

      if (currentModel) {
        previewScene.remove(currentModel);
        currentModel = null;
      }

      checkKartLockStatus(item.id);

      const displayModel = (modelScene) => {
        if (requestId !== previewRequestId) return;
        currentModel = modelScene.clone(true);
        currentModel.scale.setScalar(2.2);
        previewScene.add(currentModel);
        if (spinnerEl) spinnerEl.style.display = 'none';
      };

      // 1. REUTILIZAÇÃO INSTANTÂNEA DA MEMÓRIA RAM (0ms)
      if (window.KART_ASSETS && window.KART_ASSETS[item.id]) {
        displayModel(window.KART_ASSETS[item.id]);
        return;
      }

      if (spinnerEl) spinnerEl.style.display = 'block';

      // 2. DISK CACHE (CacheStorage do Navegador)
      const targetCacheName = typeof CACHE_NAME !== 'undefined' ? CACHE_NAME : 'pkart-3d-models-v2';
      try {
        if ('caches' in window) {
          const cache = await caches.open(targetCacheName);
          const cachedResponse = await cache.match(item.modelUrl);
          if (cachedResponse) {
            const arrayBuffer = await cachedResponse.arrayBuffer();
            gltfLoader.parse(arrayBuffer, './models/', (gltf) => {
              if (!window.KART_ASSETS) window.KART_ASSETS = {};
              window.KART_ASSETS[item.id] = gltf.scene;
              displayModel(gltf.scene);
            });
            return;
          }
        }
      } catch (err) {
        console.warn('[Lobby] Erro ao ler CacheStorage:', err);
      }

      // 3. FALLBACK DE REDE COM GRAVAÇÃO AUTOMÁTICA NO CACHE
      try {
        const response = await fetch(item.modelUrl);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

        if ('caches' in window) {
          try {
            const cache = await caches.open(targetCacheName);
            cache.put(item.modelUrl, response.clone());
          } catch (e) {
            console.warn('[Lobby] Falha ao gravar no cache:', e);
          }
        }

        const arrayBuffer = await response.arrayBuffer();
        gltfLoader.parse(arrayBuffer, './models/', (gltf) => {
          if (!window.KART_ASSETS) window.KART_ASSETS = {};
          window.KART_ASSETS[item.id] = gltf.scene;
          displayModel(gltf.scene);
        });
      } catch (networkErr) {
        console.error('[Lobby] Erro ao carregar modelo:', networkErr);
        if (spinnerEl) spinnerEl.style.display = 'none';
      }
    }

    // CORREÇÃO DA TRAVA: Garante Jolteon e Charizard como sempre desbloqueados
    function checkKartLockStatus(kartId) {
      const profile = typeof currentUserProfile !== 'undefined' ? currentUserProfile : null;

      // Jolteon e Charizard são gratuitos por padrão
      let unlockedKarts = ['jolteon', 'charizard'];

      if (profile && profile.unlocked_karts) {
        unlockedKarts = Array.from(new Set([...unlockedKarts, ...profile.unlocked_karts]));
      }

      const isUnlocked = unlockedKarts.includes(kartId);

      const btnStartRace = document.getElementById('btnStartRace');
      const btnPlaySolo = document.getElementById('btnPlaySolo');
      const btnHost = document.getElementById('btnHost');
      const kartNameEl = document.getElementById('kartName');

      const currentItem = KART_DATABASE[selectedIndex];

      if (!isUnlocked) {
        if (kartNameEl) kartNameEl.innerText = `${currentItem.name} 🔒 (BLOQUEADO)`;

        if (btnPlaySolo) { btnPlaySolo.disabled = true; btnPlaySolo.style.opacity = '0.5'; btnPlaySolo.style.cursor = 'not-allowed'; }
        if (btnHost) { btnHost.disabled = true; btnHost.style.opacity = '0.5'; btnHost.style.cursor = 'not-allowed'; }
        if (btnStartRace) { btnStartRace.disabled = true; btnStartRace.style.opacity = '0.5'; btnStartRace.style.cursor = 'not-allowed'; }
      } else {
        if (kartNameEl) kartNameEl.innerText = currentItem.name;

        if (btnPlaySolo) { btnPlaySolo.disabled = false; btnPlaySolo.style.opacity = '1'; btnPlaySolo.style.cursor = 'pointer'; }
        if (btnHost) { btnHost.disabled = false; btnHost.style.opacity = '1'; btnHost.style.cursor = 'pointer'; }
        if (btnStartRace) { btnStartRace.disabled = false; btnStartRace.style.opacity = '1'; btnStartRace.style.cursor = 'pointer'; }
      }
    }

    document.getElementById('btnPrevKart').onclick = () => {
      selectedIndex = (selectedIndex - 1 + KART_DATABASE.length) % KART_DATABASE.length;
      updatePreview();
    };

    document.getElementById('btnNextKart').onclick = () => {
      selectedIndex = (selectedIndex + 1) % KART_DATABASE.length;
      updatePreview();
    };

    // Inicialização do Lobby: Carrega apenas o kart selecionado (lazy load sob demanda)
    document.addEventListener('DOMContentLoaded', () => {
      // Não bloqueia a página baixando 13 modelos ao mesmo tempo
    });

    let peer = null;
    let roomCode = '';
    let myAssignedSlot = 0;
    const guestConnections = [];

    function getNickname() {
      const nickInput = document.getElementById('playerNicknameInput');
      const nick = nickInput ? nickInput.value.trim().toUpperCase() : 'JOGADOR';
      sessionStorage.setItem('pkart_nickname', nick);
      return nick;
    }

    document.getElementById('btnHost').onclick = () => {
      document.getElementById('lobbyStatus').textContent = 'Criando sala...';
      roomCode = Math.random().toString(36).substring(2, 7).toLowerCase();
      peer = new Peer('pkart-lobby-' + roomCode);

      peer.on('open', () => {
        document.getElementById('roomCodeDisplay').style.display = 'block';
        document.getElementById('roomCodeDisplay').textContent = 'CÓDIGO: ' + roomCode.toUpperCase();
        document.getElementById('btnStartRace').style.display = 'inline-block';
        document.getElementById('lobbyStatus').textContent = 'Sala criada! Envie o código.';
      });

      peer.on('connection', (conn) => {
        if (guestConnections.length >= 3) {
          conn.close();
          return;
        }

        const assignedSlot = guestConnections.length + 1;
        guestConnections.push(conn);

        conn.on('open', () => {
          conn.send({ t: 'assign_slot', slot: assignedSlot });
        });

        document.getElementById('lobbyStatus').textContent = `${guestConnections.length + 1}/4 Jogadores na sala!`;
      });
    };

    document.getElementById('btnJoin').onclick = () => {
      document.getElementById('joinBox').style.display = 'flex';
    };

    document.getElementById('btnConnect').onclick = () => {
      const code = document.getElementById('joinCode').value.trim().toLowerCase();
      if (!code) return;

      document.getElementById('lobbyStatus').textContent = 'Conectando...';
      peer = new Peer();

      peer.on('open', () => {
        const conn = peer.connect('pkart-lobby-' + code);

        conn.on('open', () => {
          document.getElementById('lobbyStatus').textContent = 'Conectado! Aguardando o host...';
        });

        conn.on('data', (data) => {
          if (data.t === 'assign_slot') {
            myAssignedSlot = data.slot;
          }
          if (data.t === 'start') {
            redirectToRace(code, myAssignedSlot, data.trackId || '');
          }
        });
      });
    };

    function redirectToRace(room = '', slot = 0, trackId = '') {
      const nick = getNickname();
      const kartId = KART_DATABASE[selectedIndex].id;
      const cleanRoom = room.trim().toLowerCase();
      const chosenTrack = trackId || (document.getElementById('trackSelectDropdown')?.value || '');

      let target = `game.html?nick=${encodeURIComponent(nick)}&kart=${kartId}&slot=${slot}`;
      if (cleanRoom) target += `&room=${cleanRoom}`;
      if (chosenTrack) target += `&customTrack=${chosenTrack}`;
      window.location.href = target;
    }

    document.getElementById('btnStartRace').onclick = () => {
      const chosenTrack = document.getElementById('trackSelectDropdown')?.value || '';
      guestConnections.forEach(conn => {
        if (conn.open) {
          conn.send({ t: 'start', trackId: chosenTrack });
        }
      });

      setTimeout(() => {
        redirectToRace(roomCode, 0, chosenTrack);
      }, 200);
    };

    document.getElementById('btnPlaySolo').onclick = () => {
      redirectToRace('', 0);
    };

    // Abre o Criador de Pistas
    const btnTrackBuilder = document.getElementById('btnOpenTrackBuilder');
    if (btnTrackBuilder) {
      btnTrackBuilder.onclick = () => window.location.href = 'track_builder.html';
    }

    // Carrega Pistas Aprovadas da Comunidade no Dropdown
    async function loadApprovedTracks() {
      const selectEl = document.getElementById('trackSelectDropdown');
      if (!selectEl || typeof supabaseClient === 'undefined') return;

      try {
        const { data: tracks, error } = await supabaseClient
          .from('custom_tracks')
          .select('id, name, creator_name')
          .eq('is_approved', true)
          .order('created_at', { ascending: false });

        if (error || !tracks) return;

        tracks.forEach(tr => {
          const opt = document.createElement('option');
          opt.value = tr.id;
          opt.textContent = `📍 ${tr.name} (por ${tr.creator_name})`;
          selectEl.appendChild(opt);
        });
      } catch (err) {
        console.warn('Erro ao carregar pistas da comunidade:', err);
      }
    }

    window.onload = () => {
      initPreview();
      loadApprovedTracks();
    };
  </script>
</body>

</html>
